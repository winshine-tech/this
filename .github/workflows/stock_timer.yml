name: 腾讯00700.HK 盘中5分钟AI盯盘
on:
  schedule:
    # UTC时间=北京时间-8小时
    # 港股上午9:30-12:00 → UTC 1:30~4:00
    - cron: '*/5 1-4 * * 1-5'
    # 港股下午13:00-16:00 → UTC 5:00~8:00
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run_stock_watch:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERVER_SENDKEY: ${{ secrets.SERVER_SENDKEY }}
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 配置Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装依赖requests
        run: pip install requests

      - name: 执行股票盯盘脚本
        run: python3 stock_main.py
