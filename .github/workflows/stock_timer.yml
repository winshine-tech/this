name: 腾讯00700.HK 盘中5分钟AI盯盘
on:
  schedule:
    # UTC时间=北京时间-8小时
    # 港股上午9:30-12:00 → UTC 1:30~4:00 每5分钟执行
    - cron: '*/5 1-4 * * 1-5'
    # 北京时间17:00收盘总结 = UTC 09:00，每日1次
    - cron: '0 9 * * 1-5'
  # 支持手动点击运行测试
  workflow_dispatch:

jobs:
  run_stock_watch:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SERVER_SENDKEY: ${{ secrets.SERVER_SENDKEY }}
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5

      - name: 配置Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 替换原来 pip install requests，通过txt批量安装依赖
      - name: 安装全部依赖
        run: pip install -r requirements.txt

      - name: 执行股票盯盘脚本
        run: python3 stock_main.py
